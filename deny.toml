# Supply-chain gate. Worth having here specifically because the workspace
# carries a git dependency (rusty_regx), which no registry advisory feed
# covers on its own.

[advisories]
# Fail on any known vulnerability. `unmaintained` is a warning rather than a
# hard stop: a crate going unmaintained is a signal to plan a replacement, not
# a reason to block an unrelated PR at 3am.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licences only. naner ships as a binary, so a copyleft dependency
# would impose obligations the repo has not signed up for.
#
# This is exactly the set the current tree resolves to, not a generous
# allowlist -- cargo-deny warns on entries nothing matches, and a warning
# nobody can act on is worse than no entry. A new dependency under some other
# permissive licence will fail this gate; adding its licence here is then a
# deliberate one-line review rather than something pre-approved in advance.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The in-house regex engine. Pinned to a commit SHA in the manifest, so this
# allows the repository, not an arbitrary revision of it.
allow-git = ["https://github.com/baileyrd/rusty_regx"]
