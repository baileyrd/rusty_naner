name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the pure-logic tests fast; Windows exercises the
        # cfg(windows) console code and, from Phase 3 on, archive/vendor
        # integration tests (MIGRATION_ANALYSIS §2.5).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build (Windows artifacts smoke check)
        if: runner.os == 'Windows'
        run: cargo build --release --workspace
