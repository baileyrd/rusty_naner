name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the pure-logic tests fast; Windows exercises the
        # cfg(windows) console code and, from Phase 3 on, archive/vendor
        # integration tests (MIGRATION_ANALYSIS §2.5).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No toolchain action: rust-toolchain.toml is the single source of the
      # version, and rustup installs it (with its components) on the first
      # cargo invocation. Installing `stable` here as well would pull a second
      # toolchain that nothing then uses.
      - name: Show toolchain
        run: rustup show active-toolchain && cargo --version
      # Without this every run recompiles the whole dependency tree from
      # scratch on both runners. The Windows leg feels it worst: it is the only
      # one that does a release build, and the release profile sets lto = true
      # with codegen-units = 1, so a cold build dominates the job.
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate entries per OS so the Linux and Windows caches cannot
          # evict each other.
          key: ${{ matrix.os }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build (Windows artifacts smoke check)
        if: runner.os == 'Windows'
        run: cargo build --release --workspace

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, licences and sources, per deny.toml. Linux-only: the answer
      # does not vary by runner, and the dependency graph it reads is the same
      # Cargo.lock both legs compile.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
