# Release (Phase 5 cutover). Produces the assets the update protocol
# requires — `naner.exe`, `naner-init.exe`, and `naner-bundle.zip` with the
# `.naner-version` marker inside the bundle — with the tag == package-version
# check that replaces the C# build script's Directory.Build.props rewrite
# (MIGRATION_ANALYSIS §4.2).
#
# Publishes to `baileyrd/naner` (identical tag format vX.Y.Z and asset names,
# or deployed naner-init.exe installations strand) via the NANER_RELEASE_TOKEN
# PAT secret. Full releases since the v0.5.0-alpha.0 cutover (validation
# gates signed off 2026-07-09).
#
# Bundle layout mirrors the C# first-run extraction contract; the static
# files (bin/, config/, home/, icons/, naner.bat) are vendored from
# baileyrd/naner into dist-assets/.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the single source of the compiler version;
      # rustup installs it on the first cargo invocation. Installing `stable`
      # here too would fetch a second toolchain that nothing then uses, and
      # would let a release build with a different compiler than CI verified.
      - name: Show toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $ver = ($meta.packages | Where-Object name -eq 'naner').version
          if ($tag -ne $ver) {
            throw "Tag v$tag does not match package version $ver - refusing to release (update protocol relies on tag == embedded version)"
          }

      - name: Build
        run: cargo build --release --workspace

      - name: Stage assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/bundle/vendor/bin | Out-Null
          # Static bundle content vendored from baileyrd/naner.
          Copy-Item dist-assets/* dist/bundle/ -Recurse
          Copy-Item target/release/naner.exe dist/
          Copy-Item target/release/naner-init.exe dist/
          Copy-Item target/release/naner.exe dist/bundle/vendor/bin/
          Copy-Item target/release/naner-init.exe dist/bundle/vendor/bin/
          # Written in tag form; comparisons must normalize the leading 'v'
          # (MIGRATION_ANALYSIS bug B6 - tag form is the canonical choice).
          # Named parameters required: positional Set-Content binds the value
          # as the filename and silently skips the target path.
          Set-Content -Path dist/bundle/vendor/bin/.naner-version -Value '${{ github.ref_name }}' -NoNewline
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/naner-bundle.zip

      # naner-init verifies every asset it installs against this manifest and
      # refuses to install without it, so a release missing SHA256SUMS is not
      # merely unverified - it is uninstallable. Generated after the bundle is
      # zipped so all three published assets are covered.
      - name: Generate SHA256SUMS
        shell: pwsh
        working-directory: dist
        run: |
          $assets = 'naner.exe', 'naner-init.exe', 'naner-bundle.zip'
          $lines = foreach ($a in $assets) {
            if (-not (Test-Path $a)) { throw "Expected release asset missing: $a" }
            # sha256sum format: lowercase hex, two spaces, bare file name.
            "$((Get-FileHash $a -Algorithm SHA256).Hash.ToLower())  $a"
          }
          # ASCII + explicit LF: the updater splits on whitespace, but a BOM
          # would attach to the first hash and fail every verification.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content SHA256SUMS

      - name: Publish release to baileyrd/naner
        uses: softprops/action-gh-release@v2
        with:
          repository: baileyrd/naner
          token: ${{ secrets.NANER_RELEASE_TOKEN }}
          files: |
            dist/naner.exe
            dist/naner-init.exe
            dist/naner-bundle.zip
            dist/SHA256SUMS
