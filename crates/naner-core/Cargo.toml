[package]
name = "naner-core"
description = "Shared library for the naner launcher and bootstrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the WT settings merge (#52) reads a user's
# settings.json into a Value and writes it back; without this the JSON
# object type is a BTreeMap and every key -- not just the ones actually
# touched -- comes back alphabetized instead of in the order the user left
# them.
serde_json = { version = "1", features = ["preserve_order"] }
# serde_yaml is archived; the _ng fork is the maintained continuation
# (MIGRATION_ANALYSIS §2.3). YAML is a fallback format behind JSON.
serde_yaml_ng = "0.10"
# Blocking HTTP without an async runtime (MIGRATION_ANALYSIS §2.2: the C#
# async is incidental; everything blocks). native-tls = schannel on Windows
# (system cert store + proxy behavior closest to .NET, §2.3) and OpenSSL on
# Linux; it also keeps the Windows cross-check C-free (rustls' ring backend
# can't cross-compile from Linux).
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
# Archive handling: native zip + tar.xz (pure Rust so the Windows cross-check
# works); 7z/msi/exe stay shell-outs (MIGRATION_ANALYSIS §2.3).
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"
# Web-scrape / filename version patterns: the in-house POSIX-ERE engine
# (see src/regex_shim.rs for the shorthand/case-insensitive adapter).
# Pinned to an explicit commit SHA: a bare path/branch dependency makes the
# workspace unbuildable for anyone without a sibling checkout.
rusty_regx = { git = "https://github.com/baileyrd/rusty_regx", rev = "1538e6633cb837c74c2a72f0cc63621438d8f714" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
# Retired runtime dep, kept dev-only to differential-test regex_shim against.
regex-lite = "0.1"
