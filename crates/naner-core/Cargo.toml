[package]
name = "naner-core"
description = "Shared library for the naner launcher and bootstrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusty_regx = { path = "../../../rusty_regx" }
rusty_request = { path = "../../../rusty_request" }
rusty_compress = { path = "../../../rusty_compress" }
rusty_json = { path = "../../../rusty_json" }
rusty_std = { path = "../../../rusty_std" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
regex-lite = "0.1"
