[package]
name = "naner-core"
description = "Shared library for the naner launcher and bootstrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived; the _ng fork is the maintained continuation
# (MIGRATION_ANALYSIS §2.3). YAML is a fallback format behind JSON.
serde_yaml_ng = "0.10"
# C# Dictionary preserves insertion order in practice and the export/PATH
# code depends on it; IndexMap gives the same guarantee.
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
